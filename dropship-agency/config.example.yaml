# Store -> bot registry.
#
# Copy to config.yaml and add one entry per store you want a bot assigned
# to. Never put a real token in this file -- `access_token_env` names an
# environment variable (a GitHub Actions secret in CI, or a local .env)
# that holds the real value.

stores:
  # Demo store: no credentials needed, safe to run as-is.
  - id: demo-store
    platform:
      type: mock
    supplier:
      type: mock

  # Real store example -- uncomment once you have a Shopify custom-app
  # token (see README.md) and a real supplier adapter implemented:
  # - id: friend-store-1
  #   platform:
  #     type: shopify
  #     shop_domain: friend-store-1.myshopify.com
  #     access_token_env: SHOPIFY_STORE1_TOKEN
  #   supplier:
  #     type: mock   # swap for a real SupplierAdapter once one exists
