<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dropship Agency &mdash; Bot Fleet Status</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:      #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:      #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --status-good:     #0ca30c;
      --status-warning:  #fab219;
      --status-critical: #d03b3b;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:      #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-critical: #d03b3b;
  }

  * { box-sizing: border-box; }
  body { margin: 0; }
  .viz-root {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 32px 20px 60px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin: 0 0 28px; }

  .summary-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }
  .stat-tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .stat-tile .label {
    font-size: 0.78rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .stat-tile .value {
    font-size: 1.9rem;
    font-weight: 600;
    margin-top: 4px;
    font-variant-numeric: proportional-nums;
  }

  .store-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .store-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    overflow-x: auto;
  }
  .store-card .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .store-card .store-id { font-weight: 600; font-size: 1rem; }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .status-pill .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
  }
  .status-pill.good { color: var(--status-good); }
  .status-pill.good .dot { background: var(--status-good); }
  .status-pill.critical { color: var(--status-critical); }
  .status-pill.critical .dot { background: var(--status-critical); }

  .store-card .metrics {
    display: flex;
    gap: 20px;
    margin-bottom: 10px;
  }
  .store-card .metric .value { font-size: 1.3rem; font-weight: 600; font-variant-numeric: proportional-nums; }
  .store-card .metric .label { font-size: 0.75rem; color: var(--text-muted); }
  .store-card .ran-at { font-size: 0.75rem; color: var(--text-muted); }
  .store-card .error-list {
    margin: 10px 0 0;
    padding: 8px 10px;
    background: var(--page-plane);
    border-radius: 6px;
    font-size: 0.78rem;
    color: var(--status-critical);
  }
  .error-list li { margin: 2px 0; }

  .empty {
    color: var(--text-muted);
    font-size: 0.9rem;
    padding: 40px 0;
    text-align: center;
  }
</style>
</head>
<body>
<div class="viz-root">
  <div class="wrap">
    <h1>Bot Fleet Status</h1>
    <p class="subtitle">One bot per store &mdash; last orchestration cycle</p>

    <div class="summary-row" id="summary-row"></div>
    <div class="store-grid" id="store-grid">
      <div class="empty">Loading&hellip;</div>
    </div>
  </div>
</div>

<script>
async function loadData() {
  const grid = document.getElementById('store-grid');
  const summaryRow = document.getElementById('summary-row');
  try {
    const res = await fetch('data.json', { cache: 'no-store' });
    const rows = await res.json();
    render(rows, grid, summaryRow);
  } catch (e) {
    grid.innerHTML = '<div class="empty">No run data yet &mdash; run <code>python run_once.py</code> to generate it.</div>';
  }
}

function render(rows, grid, summaryRow) {
  if (!rows.length) {
    grid.innerHTML = '<div class="empty">No stores in the registry yet.</div>';
    return;
  }

  const totalSeen = rows.reduce((s, r) => s + r.orders_seen, 0);
  const totalFulfilled = rows.reduce((s, r) => s + r.orders_fulfilled, 0);
  const totalErrors = rows.reduce((s, r) => s + r.errors.length, 0);

  summaryRow.innerHTML = [
    tile('Stores', rows.length),
    tile('Orders seen', totalSeen),
    tile('Orders fulfilled', totalFulfilled),
    tile('Errors', totalErrors),
  ].join('');

  grid.innerHTML = rows.map(storeCard).join('');
}

function tile(label, value) {
  return `<div class="stat-tile"><div class="label">${escapeHtml(label)}</div><div class="value">${value}</div></div>`;
}

function storeCard(row) {
  const hasErrors = row.errors.length > 0;
  const statusClass = hasErrors ? 'critical' : 'good';
  const statusLabel = hasErrors ? 'Errors' : 'Healthy';
  const ranAt = new Date(row.ran_at).toLocaleString();

  const errorList = hasErrors
    ? `<ul class="error-list">${row.errors.map(e => `<li>${escapeHtml(e)}</li>`).join('')}</ul>`
    : '';

  return `
    <div class="store-card">
      <div class="header">
        <span class="store-id">${escapeHtml(row.store_id)}</span>
        <span class="status-pill ${statusClass}"><span class="dot"></span>${statusLabel}</span>
      </div>
      <div class="metrics">
        <div class="metric"><div class="value">${row.orders_seen}</div><div class="label">Seen</div></div>
        <div class="metric"><div class="value">${row.orders_fulfilled}</div><div class="label">Fulfilled</div></div>
      </div>
      <div class="ran-at">Last run: ${escapeHtml(ranAt)}</div>
      ${errorList}
    </div>
  `;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = String(s);
  return div.innerHTML;
}

loadData();
</script>
</body>
</html>
