name: Trading Bot Backtest

# On-demand only (no schedule): trains on the first 80% of history and
# simulates the strategy on the held-out last 20%, so you can see real
# historical performance numbers instead of trusting the strategy blind.
# Doesn't touch live/paper state -- purely a research report.
#
# Run it: Actions tab -> Trading Bot Backtest -> Run workflow. Results show
# up on the run's summary page when it finishes.
#
# Requires EXCHANGE_API_KEY / EXCHANGE_API_SECRET repo secrets (Settings ->
# Secrets and variables -> Actions) -- Alpaca requires an API key/secret to
# fetch market data even for this read-only backtest. See
# trading-bot/README.md for how to get free paper trading keys.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trading-bot branch
        uses: actions/checkout@v4
        with:
          ref: claude/trading-bot-dev-kvjqec

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: trading-bot
        run: pip install -r requirements.txt

      - name: Prepare config
        working-directory: trading-bot
        run: |
          [ -f config.yaml ] || cp config.example.yaml config.yaml

      - name: Run backtest
        working-directory: trading-bot
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
        run: |
          set -o pipefail
          python backtest.py | tee /tmp/backtest_output.txt

      - name: Post results to run summary
        if: always()
        run: |
          {
            echo "## Backtest results"
            echo '```'
            cat /tmp/backtest_output.txt || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish backtest chart data to GitHub Pages
        if: success()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add -B gh-pages-local /tmp/gh-pages origin/gh-pages
          mkdir -p /tmp/gh-pages/trading-bot
          cp trading-bot/docs/backtest_data.json /tmp/gh-pages/trading-bot/backtest_data.json
          cd /tmp/gh-pages
          git add trading-bot/backtest_data.json
          if git diff --cached --quiet; then
            echo "No backtest chart data changes to publish."
          else
            git commit -m "Update trading bot backtest chart data [skip ci]"
            git push origin gh-pages-local:gh-pages
          fi
