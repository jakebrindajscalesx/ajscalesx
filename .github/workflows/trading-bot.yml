name: Trading Bot Cycle

# Runs the paper-trading bot on a schedule with no server of your own --
# fetches prices, maybe opens/closes a position, saves state, and publishes
# a dashboard to GitHub Pages. All bot code lives on the
# claude/trading-bot-dev-kvjqec branch; this workflow file has to live on
# the repo's default branch for the schedule trigger to fire (a GitHub
# requirement), but it checks out and runs the other branch's code rather
# than merging it in.
#
# Manual run: Actions tab -> Trading Bot Cycle -> Run workflow.
#
# Requires EXCHANGE_API_KEY / EXCHANGE_API_SECRET repo secrets (Settings ->
# Secrets and variables -> Actions) -- Alpaca requires an API key/secret to
# fetch market data even in paper mode. Without them this fails on every
# run. See trading-bot/README.md for how to get free paper trading keys.
#
# Stocks only trade NYSE hours (~9:30am-4pm ET, weekdays) -- unlike the
# earlier crypto version of this bot, most hours of most days a run can't
# do anything at all no matter how often it fires. The cron below only
# fires 13:00-21:59 UTC on weekdays (Mon-Fri), covering NYSE hours with
# margin on both sides through both EDT (13:30-20:00 UTC) and EST
# (14:30-21:00 UTC) without needing to change twice a year for daylight
# saving -- firing a bit before open / after close is harmless, the bot
# just logs "market is closed" and exits immediately. Every 5 minutes,
# offset by :02 rather than starting on the hour, for the same
# congestion-avoidance reason as before: GitHub explicitly documents that
# scheduled runs get delayed most at the top of the hour, when every
# other repo's cron jobs also fire. This doesn't guarantee exact 5-minute
# spacing (GitHub's scheduler is best-effort, not real-time) -- it
# maximizes how many of a still-unreliable number of firings land inside
# the window that can actually matter, not how tightly spaced they are.

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Shared with trading-bot-retrain.yml on purpose: both workflows commit
  # and push to the same claude/trading-bot-dev-kvjqec branch, and now that
  # this cycle fires far more often (see the Routine-driven backstop
  # described below), a same-group lock is what keeps the two from ever
  # racing to push at the same time.
  group: trading-bot-dev-branch-writes
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trading-bot branch
        uses: actions/checkout@v4
        with:
          ref: claude/trading-bot-dev-kvjqec
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: trading-bot
        run: pip install -r requirements.txt

      - name: Prepare config
        working-directory: trading-bot
        run: |
          [ -f config.yaml ] || cp config.example.yaml config.yaml

      - name: Run one trading cycle
        working-directory: trading-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
        run: python run_once.py

      - name: Commit updated state back to trading-bot branch
        working-directory: trading-bot
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          for f in state/portfolio.json state/circuit_breaker.json state/telegram_offset.json; do
            [ -f "$f" ] && git add -f "$f"
          done
          git add -f models
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Bot cycle: update state [skip ci]"
            git push origin HEAD:claude/trading-bot-dev-kvjqec
          fi

      - name: Publish dashboard to GitHub Pages
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add -B gh-pages-local /tmp/gh-pages origin/gh-pages
          mkdir -p /tmp/gh-pages/trading-bot
          cp trading-bot/docs/index.html /tmp/gh-pages/trading-bot/index.html
          cp trading-bot/docs/data.json /tmp/gh-pages/trading-bot/data.json
          cd /tmp/gh-pages
          git add trading-bot
          if git diff --cached --quiet; then
            echo "No dashboard changes to publish."
          else
            git commit -m "Update trading bot dashboard [skip ci]"
            git push origin gh-pages-local:gh-pages
          fi
